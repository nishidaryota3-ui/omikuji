<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>おみ句じ</title>

    <!-- PWA / スマホアプリ化の設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fcfbf7">
    
    <!-- アプリアイコン＆マニフェスト設定 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --bg-color: #fcfbf7;
            --text-color: #2b2b2b;
            --sub-color: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "Shippori Mincho", serif;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        /* アプリ全体のコンテナ */
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 縦書きの俳句表示エリア（絶対1列・折り返し禁止） */
        .haiku-stage {
            writing-mode: vertical-rl;
            -webkit-writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 2rem;
            line-height: 1;
            white-space: nowrap; /* 絶対に2列に折り返さない */
            max-height: 80vh;
            max-width: 80vw;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* 句切り替え時のアニメーション */
        .haiku-stage.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        /* 右上 i ボタン */
        .info-trigger {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top));
            right: 25px;
            font-family: serif;
            font-style: italic;
            font-size: 1.1rem;
            color: var(--sub-color);
            cursor: pointer;
            z-index: 100;
            opacity: 0.6;
            transition: opacity 0.2s;
            padding: 5px;
        }

        .info-trigger:hover {
            opacity: 1;
        }

        /* 右上の情報表示エリア（中央揃え構造） */
        .info-display {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            right: 15px;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            background-color: rgba(252, 251, 247, 0.9);
            padding: 6px 12px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: max-content;
        }

        .info-display.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 上段：季語（詳細季節） */
        .info-kigo-season {
            font-size: 0.85rem;
            color: var(--sub-color);
            letter-spacing: 0.05em;
            text-align: center;
            width: 100%;
            white-space: nowrap;
        }

        /* 下段：作者 */
        .info-author {
            font-size: 0.95rem;
            color: var(--text-color);
            letter-spacing: 0.05em;
            margin-top: 3px;
            text-align: center;
            width: 100%;
            white-space: nowrap;
        }

        /* 初回ローディング表示 */
        .loader {
            font-size: 1rem;
            color: var(--sub-color);
            letter-spacing: 0.2em;
            writing-mode: horizontal-tb;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 俳句メイン表示 -->
        <div id="haikuStage" class="haiku-stage">
            <div class="loader">読み込み中...</div>
        </div>

        <!-- 右上 i ボタン -->
        <div id="infoBtn" class="info-trigger">i</div>

        <!-- 右上 情報表示テキスト -->
        <div id="infoDisplay" class="info-display">
            <div id="infoKigoSeason" class="info-kigo-season"></div>
            <div id="infoAuthor" class="info-author"></div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1m0y8AOJNx1Ad4I44poPheQAQNki1-QQIwi9wSw8jaBg';
        
        let haikuList = [];
        let historyIndices = []; // 表示した句の履歴インデックス
        let historyPointer = -1;  // 現在どの履歴にいるかのポインター
        let isInfoOpen = false;

        // JSONPデータ受信
        window.mainDataReceived = function(data) {
            const rows = data.table.rows;
            haikuList = rows.map(r => {
                const getVal = (colIdx) => (r.c && r.c[colIdx] && r.c[colIdx].v !== null) ? String(r.c[colIdx].v) : '';
                return {
                    haiku: getVal(0),        // A列: 俳句
                    author: getVal(1),       // B列: 作者名
                    kigo: getVal(3),         // D列: 季語
                    seasonDetail: getVal(7)   // H列: 詳細季節（例：初春）
                };
            }).filter(item => item.haiku.trim() !== '');

            if (haikuList.length > 0) {
                showNextHaiku();
            } else {
                document.getElementById('haikuStage').innerHTML = '俳句が見つかりません';
            }
        };

        // 次の句へ進む（履歴を進める / 新規ランダム）
        function showNextHaiku() {
            if (haikuList.length === 0) return;

            if (historyPointer < historyIndices.length - 1) {
                // 履歴を前に戻った状態からの「次へ」
                historyPointer++;
                renderHaiku(historyIndices[historyPointer]);
            } else {
                // 新しい句をランダムに抽選
                let newIndex;
                const currentIdx = historyPointer >= 0 ? historyIndices[historyPointer] : -1;
                do {
                    newIndex = Math.floor(Math.random() * haikuList.length);
                } while (newIndex === currentIdx && haikuList.length > 1);

                historyIndices.push(newIndex);
                historyPointer = historyIndices.length - 1;
                renderHaiku(newIndex);
            }
        }

        // 前の句へ戻る（履歴を1つ遡る）
        function showPrevHaiku() {
            if (historyPointer > 0) {
                historyPointer--;
                renderHaiku(historyIndices[historyPointer]);
            }
        }

        // 俳句の描画処理（文字間隔調整）
        function renderHaiku(index) {
            if (isInfoOpen) toggleInfo(false);

            const stage = document.getElementById('haikuStage');
            stage.classList.add('fade-out');

            setTimeout(() => {
                const currentItem = haikuList[index];
                const text = currentItem.haiku;
                stage.textContent = text;

                // --- 文字数に応じた文字間隔（letter-spacing）の自動計算 ---
                const charCount = text.length;
                let spacing = 0.15; // 基本間隔 (em)

                if (charCount > 14) {
                    // 15文字以上の場合、文字数が増えるほど文字間隔を詰める
                    spacing = Math.max(0.01, 0.15 - ((charCount - 14) * 0.025));
                }
                stage.style.letterSpacing = `${spacing}em`;

                // 右上情報データの更新
                const kigo = currentItem.kigo || '';
                const season = currentItem.seasonDetail ? `（${currentItem.seasonDetail}）` : '';
                document.getElementById('infoKigoSeason').textContent = `${kigo}${season}`;
                document.getElementById('infoAuthor').textContent = currentItem.author || '';

                stage.classList.remove('fade-out');
            }, 200);
        }

        // --- 操作系イベント設定 ---

        // 1. クリック操作（画面クリックで次の句へ）
        document.addEventListener('click', (e) => {
            if (e.target.closest('#infoBtn') || e.target.closest('#infoDisplay')) return;

            if (isInfoOpen) {
                toggleInfo(false);
                return;
            }

            showNextHaiku();
        });

        // 2. キーボード操作（矢印キー・スペース）
        document.addEventListener('keydown', (e) => {
            if (isInfoOpen && ['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', ' ', 'Enter'].includes(e.key)) {
                toggleInfo(false);
                return;
            }

            if (e.key === 'ArrowLeft') {
                // 左矢印：前の句へ戻る
                showPrevHaiku();
            } else if (['ArrowRight', 'ArrowDown', 'ArrowUp', ' ', 'Enter'].includes(e.key)) {
                // 右矢印・スペース・Enter：次の句へ
                showNextHaiku();
            }
        });

        // 3. タッチ・スワイプ操作（スマホ用）
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        document.addEventListener('touchend', (e) => {
            if (e.target.closest('#infoBtn') || e.target.closest('#infoDisplay')) return;

            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            // スワイプ判定（30px以上の移動）
            if (Math.abs(diffX) > 30 && Math.abs(diffX) > Math.abs(diffY)) {
                if (isInfoOpen) {
                    toggleInfo(false);
                    return;
                }

                if (diffX > 0) {
                    // 右スワイプ（→）：前の句へ戻る
                    showPrevHaiku();
                } else {
                    // 左スワイプ（←）：次の句へ進む
                    showNextHaiku();
                }
            } else if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
                // タップ操作：次の句へ
                if (isInfoOpen) {
                    toggleInfo(false);
                } else {
                    showNextHaiku();
                }
            }
        }, {passive: true});

        // i ボタン切り替え
        const infoBtn = document.getElementById('infoBtn');
        const infoDisplay = document.getElementById('infoDisplay');

        infoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleInfo(!isInfoOpen);
        });

        infoDisplay.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleInfo(false);
        });

        function toggleInfo(show) {
            isInfoOpen = show;
            if (isInfoOpen) {
                infoBtn.style.opacity = '0';
                infoDisplay.classList.add('active');
            } else {
                infoBtn.style.opacity = '0.6';
                infoDisplay.classList.remove('active');
            }
        }

        // データ取得
        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?range=A:H&tqx=responseHandler:mainDataReceived`;
        document.body.appendChild(script);
    </script>
</body>
</html>
