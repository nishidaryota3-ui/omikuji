<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>おみ句じ</title>
    <link rel="manifest" href="manifest.json">

    <!-- PWA / スマホアプリ化の設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#fcfbf7">
    
    <!-- アプリアイコン設定（icon.pngを配置するとホーム画面に反映されます） -->
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg-color: #fcfbf7;
            --text-color: #2b2b2b;
            --sub-color: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "Shippori Mincho", serif;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        /* アプリ全体のコンテナ */
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 縦書きの俳句表示エリア */
        .haiku-stage {
            writing-mode: vertical-rl;
            -webkit-writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 2rem;
            line-height: 2.2;
            letter-spacing: 0.15em;
            max-height: 75vh;
            max-width: 80vw;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* 句切り替え時のアニメーション */
        .haiku-stage.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        /* 右上 i ボタン（控えめなオリジナルデザイン） */
        .info-trigger {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top));
            right: 25px;
            font-family: serif;
            font-style: italic;
            font-size: 1.1rem;
            color: var(--sub-color);
            cursor: pointer;
            z-index: 100;
            opacity: 0.6;
            transition: opacity 0.2s;
            padding: 5px;
        }

        .info-trigger:hover {
            opacity: 1;
        }

        /* 右上の情報表示エリア（完全センター揃え構造） */
        .info-display {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            right: 15px;
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            background-color: rgba(252, 251, 247, 0.9);
            padding: 6px 12px;
            border-radius: 6px;
            
            /* 内部要素を完全に中央揃え */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: max-content;
        }

        .info-display.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 上段：季語（詳細季節） */
        .info-kigo-season {
            font-size: 0.85rem;
            color: var(--sub-color);
            letter-spacing: 0.05em;
            text-align: center;
            width: 100%;
            white-space: nowrap;
        }

        /* 下段：作者 */
        .info-author {
            font-size: 0.95rem;
            color: var(--text-color);
            letter-spacing: 0.05em;
            margin-top: 3px;
            text-align: center;
            width: 100%;
            white-space: nowrap;
        }

        /* 初回ローディング表示 */
        .loader {
            font-size: 1rem;
            color: var(--sub-color);
            letter-spacing: 0.2em;
            writing-mode: horizontal-tb;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 俳句メイン表示 -->
        <div id="haikuStage" class="haiku-stage">
            <div class="loader">読み込み中...</div>
        </div>

        <!-- 右上 i ボタン -->
        <div id="infoBtn" class="info-trigger">i</div>

        <!-- 右上 情報表示テキスト（二段構造・センター揃え） -->
        <div id="infoDisplay" class="info-display">
            <div id="infoKigoSeason" class="info-kigo-season"></div>
            <div id="infoAuthor" class="info-author"></div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1m0y8AOJNx1Ad4I44poPheQAQNki1-QQIwi9wSw8jaBg';
        
        let haikuList = [];
        let currentIndex = -1;
        let isInfoOpen = false;

        // JSONPデータ受信
        window.mainDataReceived = function(data) {
            const rows = data.table.rows;
            haikuList = rows.map(r => {
                const getVal = (colIdx) => (r.c && r.c[colIdx] && r.c[colIdx].v !== null) ? String(r.c[colIdx].v) : '';
                return {
                    haiku: getVal(0),        // A列: 俳句
                    author: getVal(1),       // B列: 作者名
                    kigo: getVal(3),         // D列: 季語
                    seasonDetail: getVal(7)   // H列: 詳細季節（例：初春）
                };
            }).filter(item => item.haiku.trim() !== '');

            if (haikuList.length > 0) {
                showRandomHaiku();
            } else {
                document.getElementById('haikuStage').innerHTML = '俳句が見つかりません';
            }
        };

        // 次の句（ランダム表示）
        function showNextHaiku() {
            if (haikuList.length === 0) return;
            
            if (isInfoOpen) toggleInfo(false);

            const stage = document.getElementById('haikuStage');
            stage.classList.add('fade-out');

            setTimeout(() => {
                showRandomHaiku();
                stage.classList.remove('fade-out');
            }, 200);
        }

        function showRandomHaiku() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * haikuList.length);
            } while (newIndex === currentIndex && haikuList.length > 1);
            
            currentIndex = newIndex;
            const currentItem = haikuList[currentIndex];

            // 俳句本文
            document.getElementById('haikuStage').textContent = currentItem.haiku;

            // 上段テキスト（例：春朝し（初春））
            const kigo = currentItem.kigo || '';
            const season = currentItem.seasonDetail ? `（${currentItem.seasonDetail}）` : '';
            document.getElementById('infoKigoSeason').textContent = `${kigo}${season}`;

            // 下段テキスト（例：西田上酢）
            document.getElementById('infoAuthor').textContent = currentItem.author || '';
        }

        // --- 操作系イベント設定 ---

        // 1. クリック操作
        document.addEventListener('click', (e) => {
            if (e.target.closest('#infoBtn') || e.target.closest('#infoDisplay')) return;

            if (isInfoOpen) {
                toggleInfo(false);
                return;
            }

            showNextHaiku();
        });

        // 2. キーボード操作
        document.addEventListener('keydown', (e) => {
            if (['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', ' ', 'Enter'].includes(e.key)) {
                if (isInfoOpen) {
                    toggleInfo(false);
                } else {
                    showNextHaiku();
                }
            }
        });

        // 3. タッチ・スワイプ操作
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        document.addEventListener('touchend', (e) => {
            if (e.target.closest('#infoBtn') || e.target.closest('#infoDisplay')) return;

            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = Math.abs(touchEndX - touchStartX);
            const diffY = Math.abs(touchEndY - touchStartY);

            if (diffX > 30 || diffY > 30 || (diffX < 10 && diffY < 10)) {
                if (isInfoOpen) {
                    toggleInfo(false);
                } else {
                    showNextHaiku();
                }
            }
        }, {passive: true});

        // i ボタン切り替え
        const infoBtn = document.getElementById('infoBtn');
        const infoDisplay = document.getElementById('infoDisplay');

        infoBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleInfo(!isInfoOpen);
        });

        infoDisplay.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleInfo(false);
        });

        function toggleInfo(show) {
            isInfoOpen = show;
            if (isInfoOpen) {
                infoBtn.style.opacity = '0';
                infoDisplay.classList.add('active');
            } else {
                infoBtn.style.opacity = '0.6';
                infoDisplay.classList.remove('active');
            }
        }

        // データ取得
        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?range=A:H&tqx=responseHandler:mainDataReceived`;
        document.body.appendChild(script);
    </script>
</body>
</html>
